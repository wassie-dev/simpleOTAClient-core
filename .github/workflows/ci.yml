# Host unit tests for the core, and compile checks of the core and the ESP32
# port under ESP-IDF and Arduino-ESP32, on every push to main and every PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    name: Host tests (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Build and run
        run: make -C test/host test CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}

      - name: Build and run with sanitizers
        run: |
          make -C test/host clean
          make -C test/host test CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} \
            CFLAGS="-std=c99 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all" \
            CXXFLAGS="-std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all"

  sync-script:
    name: Sync script round trip
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy, check, and detect a change
        run: |
          set -euo pipefail
          scripts/sync-core.sh "$RUNNER_TEMP/copy"
          scripts/sync-core.sh --check "$RUNNER_TEMP/copy"
          echo "// drift" >> "$RUNNER_TEMP/copy/sota_time.h"
          if scripts/sync-core.sh --check "$RUNNER_TEMP/copy"; then
            echo "a changed copy passed the check" >&2
            exit 1
          fi

  esp-idf:
    name: ESP-IDF ${{ matrix.idf }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - idf: v5.1.4
            target: esp32
          - idf: v5.4.4
            target: esp32c6
          - idf: v5.5.5
            target: esp32s3
          - idf: latest
            target: esp32c3

    steps:
      - uses: actions/checkout@v4

      - name: Build the port smoke app
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: test/esp-idf

  arduino:
    name: Arduino-ESP32 ${{ matrix.core }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ["2.0.17", "3.3.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Compile the port smoke sketch
        run: |
          set -euo pipefail
          lib="$RUNNER_TEMP/libraries/SimpleOTACore/src"
          mkdir -p "$lib"
          cp core/* port/esp32/* "$lib/"
          printf 'name=SimpleOTACore\nversion=0.0.0\narchitectures=esp32\n' \
            > "$RUNNER_TEMP/libraries/SimpleOTACore/library.properties"
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ matrix.core }}
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all \
            --library "$RUNNER_TEMP/libraries/SimpleOTACore" test/arduino/PortSmoke
