name: CI

# Every push runs the host tests, the sync check and the API reference build,
# which take a minute; a push to main or a v* tag also publishes the
# reference for that version.
# The firmware builds take far longer on the one runner, so they run on pull
# requests, tags and manual runs only (Actions > CI > Run workflow).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run still waiting or running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests (${{ matrix.cc }})
    runs-on: [self-hosted, linux, x64, tower, simpleotaclient-core]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential clang

      - name: Build and run
        run: make -C test/host test CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}

      - name: Build and run with sanitizers
        run: |
          make -C test/host clean
          make -C test/host test CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} \
            CFLAGS="-std=c99 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all" \
            CXXFLAGS="-std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all"

  sync-script:
    name: Sync script round trip
    runs-on: [self-hosted, linux, x64, tower, simpleotaclient-core]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - name: Copy, check, and detect a change
        run: |
          set -euo pipefail
          scripts/sync-core.sh "$RUNNER_TEMP/copy" "$RUNNER_TEMP/include"
          scripts/sync-core.sh --check "$RUNNER_TEMP/copy" "$RUNNER_TEMP/include"
          echo "// drift" >> "$RUNNER_TEMP/copy/sota_time.h"
          if scripts/sync-core.sh --check "$RUNNER_TEMP/copy" "$RUNNER_TEMP/include"; then
            echo "a changed copy passed the check" >&2
            exit 1
          fi
          scripts/sync-core.sh "$RUNNER_TEMP/copy" "$RUNNER_TEMP/include"
          echo "// drift" >> "$RUNNER_TEMP/include/simpleota.h"
          if scripts/sync-core.sh --check "$RUNNER_TEMP/copy" "$RUNNER_TEMP/include"; then
            echo "a changed header passed the check" >&2
            exit 1
          fi

  docs:
    name: API reference
    runs-on: [self-hosted, linux, x64, tower, simpleotaclient-core]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      # The Doxyfile fails on any warning, so an undocumented declaration
      # fails the build.
      - name: Build
        env:
          DOCS_VERSION: ${{ github.ref_name }}
        run: mkdir -p build/docs && doxygen

      - uses: actions/upload-artifact@v4
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: api-reference
          path: build/docs/html

  # Adds main's or the tag's reference to the gh-pages branch, keeping every
  # earlier tag's. GitHub Pages serves that branch: Settings > Pages >
  # Deploy from a branch, gh-pages, / (root).
  docs-publish:
    name: Publish the API reference
    needs: docs
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: [self-hosted, linux, x64, tower, simpleotaclient-core]
    permissions:
      contents: write
    # One publish at a time, never cancelled, so no version is lost.
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: api-reference
          path: ${{ runner.temp }}/html

      - name: Commit to gh-pages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          rm -rf "$site"
          git worktree prune
          git branch -D gh-pages 2>/dev/null || true
          if git fetch --depth 1 origin gh-pages; then
            git worktree add "$site" FETCH_HEAD
            git -C "$site" switch -c gh-pages
          else
            git worktree add --detach "$site"
            git -C "$site" switch --orphan gh-pages
          fi
          scripts/publish-docs.sh "$RUNNER_TEMP/html" "$site" "$VERSION"
          cd "$site"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "API reference for $VERSION ($GITHUB_SHA)"
            git push origin gh-pages
          fi
          cd - >/dev/null
          git worktree remove --force "$site"

  esp-idf:
    name: ESP-IDF ${{ matrix.idf }} (${{ matrix.target }})
    runs-on: [self-hosted, linux, x64, tower, simpleotaclient-core]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - idf: v5.1.4
            target: esp32
          - idf: v5.4.4
            target: esp32c6
          - idf: v5.5.5
            target: esp32s3
          - idf: latest
            target: esp32c3

    steps:
      - uses: actions/checkout@v4

      - name: Build the port smoke app
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: test/esp-idf

  arduino:
    name: Arduino-ESP32 ${{ matrix.core }}
    runs-on: [self-hosted, linux, x64, tower, simpleotaclient-core]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        core: ["2.0.17", "3.3.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      # Core 2.x runs esptool.py, which needs pyserial; the runner's Python
      # has none. Put the pinned wheel on PYTHONPATH rather than install it.
      - name: Provide pyserial
        if: startsWith(matrix.core, '2.')
        run: |
          set -euo pipefail
          whl="$RUNNER_TEMP/pyserial-3.5-py2.py3-none-any.whl"
          curl -sSfL -o "$whl" \
            https://files.pythonhosted.org/packages/py2.py3/p/pyserial/pyserial-3.5-py2.py3-none-any.whl
          echo "c4451db6ba391ca6ca299fb3ec7bae67a5c55dde170964c7a14ceefec02f2cf0  $whl" | sha256sum -c -
          echo "PYTHONPATH=$whl" >> "$GITHUB_ENV"

      - name: Compile the port smoke sketch
        run: |
          set -euo pipefail
          lib="$RUNNER_TEMP/libraries/SimpleOTACore/src"
          mkdir -p "$lib"
          cp core/* port/esp32/* include/* "$lib/"
          printf 'name=SimpleOTACore\nversion=0.0.0\narchitectures=esp32\n' \
            > "$RUNNER_TEMP/libraries/SimpleOTACore/library.properties"
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ matrix.core }}
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all \
            --library "$RUNNER_TEMP/libraries/SimpleOTACore" test/arduino/PortSmoke
